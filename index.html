$("lo").onclick=async()=>{await sb.auth.signOut();mode="login";$("pw").value="";$("cd").value="";amClear();applyLang()};
if(sb)sb.auth.onAuthStateChange((_,s)=>{me=s?s.user:null;$("auth").style.display=me?"none":"block";$("app").style.display=me?"block":"none";$("lo").style.display=me?"inline-block":"none";ch.forEach(c=>sb.removeChannel(c));ch=[];if(me)start()});
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x==b));document.querySelectorAll(".v").forEach(v=>v.classList.toggle("on",v.id=="v-"+b.dataset.t))});
async function start(){await loadDonor();loadN();loadM();
 ch.push(sb.channel("n").on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+me.id},loadN).subscribe());
 ch.push(sb.channel("r").on("postgres_changes",{event:"INSERT",schema:"public",table:"responses"},loadM).subscribe())}
async function loadDonor(){const{data}=await sb.from("donors").select("*").eq("user_id",me.id).maybeSingle();donor=data;const f=$("df");if(data){for(const k of["name","blood_group","district","area","phone","last_donation"])f[k].value=data[k]||"";f.available.checked=data.available}$("dd").style.display=data?"inline-block":"none"}
$("df").onsubmit=async e=>{e.preventDefault();const f=e.target;const{error}=await sb.from("donors").upsert({user_id:me.id,name:f.name.value,blood_group:f.blood_group.value,district:f.district.value,area:f.area.value,phone:f.phone.value,last_donation:f.last_donation.value||null,available:f.available.checked});error?setMsg("dm","",error.message):setMsg("dm","saved");await loadDonor()};
$("dd").onclick=async()=>{if(confirm(t("cdel"))){await sb.from("donors").delete().eq("user_id",me.id);$("df").reset();setMsg("dm","","");loadDonor()}};
$("rf").onsubmit=async e=>{e.preventDefault();const f=e.target,o={};new FormData(f).forEach((v,k)=>o[k]=v);o.bags=+o.bags||1;const{error}=await sb.from("requests").insert(o);error?setMsg("rm","",error.message):setMsg("rm","rSent");if(!error){f.reset();$("urg").value="Urgent";loadM()}};
async function loadN(){const{data}=await sb.from("notifications").select("*, requests(status,blood_group,urgency,hospital,district,phone)").order("created_at",{ascending:false}).limit(50);NL=data||[];renderN()}
function renderN(){const b=$("nl");b.textContent="";const un_=NL.filter(n=>!n.read).length;$("nc").textContent=un_?"("+un_+")":"";
 if(!NL.length)b.append(el("p","m",t("noN")));
 NL.forEach(n=>{const r=n.requests,c=el("div","c");
  c.append(el("p",0,r?L[lang].bneeded(r.blood_group,un(r.urgency),r.hospital,dn(r.district)):n.message));
  if(r)c.append(el("p","m",t("call")+r.phone));
  c.append(el("p","m",new Date(n.created_at).toLocaleString(lang=="bn"?"bn-BD":"en-GB")));
  if(r&&r.status=="open"){const a=el("button",0,t("accept"));a.onclick=async()=>{if(!donor){alert(t("needP"));return}const{error}=await sb.from("responses").insert({request_id:n.request_id,donor_name:donor.name,donor_phone:donor.phone});await sb.from("notifications").update({read:true}).eq("id",n.id);a.textContent=error?t("already"):t("accepted");a.disabled=true};c.append(a)}
  b.append(c)})}
async function loadM(){const{data}=await sb.from("requests").select("*, responses(donor_name,donor_phone)").eq("user_id",me.id).order("created_at",{ascending:false});ML=data||[];renderM()}
function renderM(){const b=$("ml");b.textContent="";if(!ML.length)b.append(el("p","m",t("noM")));
 ML.forEach(r=>{const c=el("div","c");c.append(el("span","bg",r.blood_group));c.append(el("b",0,r.patient+" - "+r.hospital+", "+dn(r.district)));c.append(el("p","m",t("status")+t(r.status=="open"?"open":"done")));
  const rs=r.responses||[];c.append(el("p",rs.length?"g":"m",rs.length?rs.length+t("coming"):t("none")));
  rs.forEach(x=>{const a=el("a",0,x.donor_name+" - "+x.donor_phone);a.href="tel:"+x.donor_phone;a.style.display="block";c.append(a)});
  if(r.status=="open"){const d=el("button","o",t("markDone"));d.onclick=async()=>{await sb.from("requests").update({status:"done"}).eq("id",r.id);loadM()};c.append(d)}b.append(c)})}
applyLang();if(initErr)setMsg("am",initErr,initErr);
</script></body></html>
