/* ===== OOP: classes (attributes + methods) ===== */
class Language{ // ভাষা বদল
 static toggle(){lang=lang=="en"?"bn":"en";try{localStorage.setItem("lang",lang)}catch(e){}}
}
class AuthService{ // লগইন/রেজিস্ট্রেশন/কোড/পাসওয়ার্ড রিসেট
 static login(e,p){return sb.auth.signInWithPassword({email:e,password:p})}
 static register(e,p,n){return sb.auth.signUp({email:e,password:p,options:{data:{name:n}}})}
 static verify(e,c){return sb.auth.verifyOtp({email:e,token:c,type:"signup"})}
 static sendReset(e){return sb.auth.resetPasswordForEmail(e)}
 static resend(e){return sb.auth.resend({type:"signup",email:e})}
 static async resetPassword(e,c,p){const r=await sb.auth.verifyOtp({email:e,token:c,type:"recovery"});return r.error?r:sb.auth.updateUser({password:p})}
 static logout(){return sb.auth.signOut()}
}
class Person{ // Abstraction + Encapsulation: abstract class, private ফিল্ড + getter
 #name;#phone;
 constructor(n,p){if(new.target===Person)throw new Error("Person is abstract");this.#name=n;this.#phone=p}
 get name(){return this.#name}
 get phone(){return this.#phone}
 role(){throw new Error("role() must be overridden")}
}
class Donor extends Person{ // Inheritance
 constructor(r){super(r.name,r.phone);this.bloodGroup=r.blood_group;this.district=r.district;this.area=r.area||"";this.lastDonation=r.last_donation||"";this.available=r.available!==false}
 role(){return "Donor"} // Polymorphism
 static async load(uid){const{data}=await sb.from("donors").select("*").eq("user_id",uid).maybeSingle();return data?new Donor(data):null}
 save(uid){return sb.from("donors").upsert({user_id:uid,name:this.name,blood_group:this.bloodGroup,district:this.district,area:this.area,phone:this.phone,last_donation:this.lastDonation||null,available:this.available})}
 static remove(uid){return sb.from("donors").delete().eq("user_id",uid)}
}
class BloodRequest{
 constructor(r){this.id=r.id;this.patient=r.patient;this.bloodGroup=r.blood_group;this.hospital=r.hospital;this.district=r.district;this.phone=r.phone;this.urgency=r.urgency;this.status=r.status;this.responses=r.responses||[]}
 isOpen(){return this.status=="open"}
 static async mine(uid){const{data}=await sb.from("requests").select("*, responses(donor_name,donor_phone)").eq("user_id",uid).order("created_at",{ascending:false});return(data||[]).map(r=>new BloodRequest(r))}
 static create(o){return sb.from("requests").insert(o)}
 markDone(){return sb.from("requests").update({status:"done"}).eq("id",this.id)}
}
class AppNotification{
 constructor(r){this.id=r.id;this.requestId=r.request_id;this.read=r.read;this.message=r.message;this.createdAt=r.created_at;this.request=r.requests?new BloodRequest(r.requests):null}
 text(){const r=this.request;return r?L[lang].bneeded(r.bloodGroup,un(r.urgency),r.hospital,dn(r.district)):this.message}
 static async all(){const{data}=await sb.from("notifications").select("*, requests(status,blood_group,urgency,hospital,district,phone)").order("created_at",{ascending:false}).limit(50);return(data||[]).map(r=>new AppNotification(r))}
 markRead(){return sb.from("notifications").update({read:true}).eq("id",this.id)}
 async accept(d){const{error}=await sb.from("responses").insert({request_id:this.requestId,donor_name:d.name,donor_phone:d.phone});await this.markRead();return error}
}
class AiAssistant{ // AI সহকারী (Supabase Edge Function ঘুরে)
 static async ask(q){const{data,error}=await sb.functions.invoke("ask-ai",{body:{question:q,lang:lang}});if(error||!data||!data.answer)throw new Error("ai");return data.answer}
}

/* ===== UI ===== */
$("lg").onclick=()=>{Language.toggle();applyLang()};
$("sw").onclick=()=>{mode=mode=="login"?"reg":"login";$("cd").value="";amClear();applyLang()};
$("fg").onclick=async ev=>{ev.preventDefault();amClear();
 if(mode=="login"){mode="forgot";applyLang();return}
 if(!sb){amErr(initErr);return}
 const e=$("em").value.trim();if(!e){amErr(t("needEmail"));return}
 const r=mode=="verify"?await AuthService.resend(e):await AuthService.sendReset(e);
 if(r.error)amErr(r.error.message);else amOk("codeSent")};
$("ab").onclick=async()=>{amClear();if(!sb){amErr(initErr);return}
 const e=$("em").value.trim(),p=$("pw").value,c=$("cd").value.trim();let r;
 if(!e){amErr(t("needEmail"));return}
 if(mode=="login"){r=await AuthService.login(e,p);if(r.error)amErr(r.error.message)}
 else if(mode=="reg"){r=await AuthService.register(e,p,$("nm").value);
  if(r.error)amErr(r.error.message);
  else if(!r.data.session){
   if(r.data.user&&r.data.user.identities&&r.data.user.identities.length==0)amErr("User already registered");
   else{mode="verify";applyLang();amOk("codeSent")}}}
 else if(mode=="verify"){if(!c){amErr(t("needCode"));return}r=await AuthService.verify(e,c);if(r.error)amErr(r.error.message)}
 else if(mode=="forgot"){r=await AuthService.sendReset(e);if(r.error)amErr(r.error.message);else{mode="reset";applyLang();amOk("codeSent")}}
 else if(mode=="reset"){if(!c){amErr(t("needCode"));return}if(p.length<6){amErr(t("short"));return}
  r=await AuthService.resetPassword(e,c,p);if(r.error)amErr(r.error.message);else alert(t("pwDone"))}};
$("lo").onclick=async()=>{await AuthService.logout();mode="login";$("pw").value="";$("cd").value="";amClear();applyLang()};

async function start(){await loadDonor();loadN();loadM();

async function loadDonor(){donor=await Donor.load(me.id);const f=$("df");if(donor){f["name"].value=donor.name;f["blood_group"].value=donor.bloodGroup;f["district"].value=donor.district;f["area"].value=donor.area;f["phone"].value=donor.phone;f["last_donation"].value=donor.lastDonation;f.available.checked=donor.available}$("dd").style.display=donor?"inline-block":"none"}

$("dd").onclick=async()=>{if(confirm(t("cdel"))){await Donor.remove(me.id);$("df").reset();setMsg("dm","","");loadDonor()}};

async function loadN(){NL=await AppNotification.all();renderN()}
function renderN(){const b=$("nl");b.textContent="";const u=NL.filter(n=>!n.read).length;$("nc").textContent=u?"("+u+")":"";
 if(!NL.length)b.append(el("p","m",t("noN")));
 NL.forEach(n=>{const r=n.request,c=el("div","c");

  b.append(c)})}
async function loadM(){ML=await BloodRequest.mine(me.id);renderM()}
function renderM(){const b=$("ml");b.textContent="";if(!ML.length)b.append(el("p","m",t("noM")));
 ML.forEach(r=>{const c=el("div","c");c.append(el("span","bg",r.bloodGroup));c.append(el("b",0,r.patient+" - "+r.hospital+", "+dn(r.district)));c.append(el("p","m",t("status")+t(r.isOpen()?"open":"done")));

(function(){try{
const G=["A+","A-","B+","B-","AB+","AB-","O+","O-"];let sel="A+";
const can=(d,r)=>{const A=x=>x.indexOf("A")>-1,B=x=>x.indexOf("B")>-1,P=x=>x.indexOf("+")>-1;return(!A(d)||A(r))&&(!B(d)||B(r))&&(!P(d)||P(r))};
const bn=()=>typeof lang!=="undefined"&&lang==="bn";

 const h=document.createElement("h3");h.textContent=b?"\u09B0\u0995\u09CD\u09A4\u09C7\u09B0 \u09B8\u09BE\u09AE\u099E\u09CD\u099C\u09B8\u09CD\u09AF\u09A4\u09BE":"Blood compatibility";box.append(h);
 const p=document.createElement("p");p.className="m";p.textContent=b?"\u098F\u0995\u099F\u09BF \u0997\u09CD\u09B0\u09C1\u09AA \u099A\u09BE\u09AA\u09C1\u09A8":"Tap a blood group";box.append(p);

 row("rc",(b?"\u0995\u09BE\u09B0 \u09B0\u0995\u09CD\u09A4 \u09A8\u09BF\u09A4\u09C7 \u09AA\u09BE\u09B0\u09AC\u09C7\u09A8":"You can receive from")+" ("+sel+")",G.filter(d=>can(d,sel)));
}
draw();

}catch(e){}})();
